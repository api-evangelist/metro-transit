openapi: 3.2.0
info:
  title: Schedule API
  description: API for getting Metro Transit planned schedule information.
  version: '1'
tags:
- name: Schedule
paths:
  /schedule/routedetails/{route_url_param}:
    get:
      tags:
      - Schedule
      parameters:
      - name: route_url_param
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetails'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get schedule routedetails by route url param
      x-summary-source: derived
      operationId: getScheduleRoutedetailsByRouteUrlParam
      x-operation-id-source: derived
  /schedule/routes:
    get:
      tags:
      - Schedule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteListItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get schedule routes
      x-summary-source: derived
      operationId: getScheduleRoutes
      x-operation-id-source: derived
  /schedule/stoplist/{route_id}/{schedule_number}:
    get:
      tags:
      - Schedule
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
      - name: schedule_number
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StopListItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get schedule stoplist by route id by schedule number
      x-summary-source: derived
      operationId: getScheduleStoplistByRouteIdByScheduleNumber
      x-operation-id-source: derived
  /schedule/stops/{route_id}/{schedule_number}/{board_stop}/{exit_stop}:
    get:
      tags:
      - Schedule
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
      - name: schedule_number
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: board_stop
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: exit_stop
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopSchedule'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get schedule stops by route id by schedule number by board stop by exit stop
      x-summary-source: derived
      operationId: getScheduleStopsByRouteIdByScheduleNumberByBoardStopByExitStop
      x-operation-id-source: derived
  /schedule/timetable/{route_id}/{schedule_number}:
    get:
      tags:
      - Schedule
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
      - name: schedule_number
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timetable'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get schedule timetable by route id by schedule number
      x-summary-source: derived
      operationId: getScheduleTimetableByRouteIdByScheduleNumber
      x-operation-id-source: derived
components:
  schemas:
    ScheduleType:
      type: object
      properties:
        schedule_type_name:
          type:
          - string
          - 'null'
        view_order:
          type: integer
          format: int32
        booking:
          type:
          - string
          - 'null'
        timetables:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TimetableDetail'
      additionalProperties: false
    TimetableDetail:
      type: object
      properties:
        schedule_number:
          type: integer
          format: int32
        direction:
          type:
          - string
          - 'null'
        direction_id:
          type: integer
          format: int32
      additionalProperties: false
    Trip:
      type: object
      properties:
        route_label:
          type:
          - string
          - 'null'
        comment_tag:
          type:
          - string
          - 'null'
        stop_times:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StopTime'
      additionalProperties: false
    StopBoardExit:
      type: object
      properties:
        route_label:
          type:
          - string
          - 'null'
        trip_comment:
          type:
          - string
          - 'null'
          readOnly: true
        board_time:
          type:
          - string
          - 'null'
        board_comment:
          type:
          - string
          - 'null'
          readOnly: true
        exit_time:
          type:
          - string
          - 'null'
        exit_comment:
          type:
          - string
          - 'null'
          readOnly: true
      additionalProperties: false
    RouteListItem:
      type: object
      properties:
        route_id:
          type:
          - string
          - 'null'
        route_short_name:
          type:
          - string
          - 'null'
        agency_id:
          type: integer
          format: int32
        route_label:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        route_url_param:
          type:
          - string
          - 'null'
          readOnly: true
      additionalProperties: false
    StopListItem:
      type: object
      properties:
        stop_id:
          type: integer
          format: int32
        stop_name:
          type:
          - string
          - 'null'
        timepoint:
          type: boolean
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Footnote:
      type: object
      properties:
        comment_tag:
          type:
          - string
          - 'null'
        comment_text:
          type:
          - string
          - 'null'
      additionalProperties: false
    StopSchedule:
      type: object
      properties:
        departures:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StopBoardExit'
        footnotes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Footnote'
      additionalProperties: false
    Timetable:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        timepoints:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Timepoint'
        trips:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Trip'
        footnotes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Footnote'
      additionalProperties: false
    StopTime:
      type: object
      properties:
        departure_time:
          type:
          - string
          - 'null'
        place_sequence:
          type: integer
          format: int32
        comment_tag:
          type:
          - string
          - 'null'
      additionalProperties: false
    RouteDetails:
      type: object
      properties:
        route_id:
          type:
          - string
          - 'null'
        agency_id:
          type: integer
          format: int32
        agency_name:
          type:
          - string
          - 'null'
        pick_change:
          type:
          - string
          - 'null'
        route_short_name:
          type:
          - string
          - 'null'
        route_long_name:
          type:
          - string
          - 'null'
        route_desc:
          type:
          - string
          - 'null'
        route_type:
          type: integer
          format: int32
        route_type_name:
          type:
          - string
          - 'null'
          readOnly: true
        route_url:
          type:
          - string
          - 'null'
        route_color:
          type:
          - string
          - 'null'
        route_text_color:
          type:
          - string
          - 'null'
        provider_contact:
          type:
          - string
          - 'null'
        route_comment:
          type:
          - string
          - 'null'
        schedules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ScheduleType'
      additionalProperties: false
    Timepoint:
      type: object
      properties:
        timepoint_label:
          type:
          - string
          - 'null'
        place_sequence:
          type: integer
          format: int32
        map_reference:
          type: integer
          format: int32
        downtown_zone:
          type:
          - string
          - 'null'
      additionalProperties: false
