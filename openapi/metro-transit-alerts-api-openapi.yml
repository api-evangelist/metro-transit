openapi: 3.2.0
info:
  title: Service Alerts API
  description: API for retrieving Transit Service Alerts
  version: '1'
tags:
- name: Alerts
paths:
  /alerts/{id}:
    get:
      tags:
      - Alerts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IAlert'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get alerts by id
      x-summary-source: derived
      operationId: getAlertsById
      x-operation-id-source: derived
  /alerts/alert/{id}:
    get:
      tags:
      - Alerts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAlert'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get alerts alert by id
      x-summary-source: derived
      operationId: getAlertsAlertById
      x-operation-id-source: derived
  /alerts/all:
    get:
      tags:
      - Alerts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IAlert'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get alerts all
      x-summary-source: derived
      operationId: getAlertsAll
      x-operation-id-source: derived
components:
  schemas:
    Image:
      type: object
      properties:
        localized_image:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LocalizedImage'
      additionalProperties: false
    TranslatedString:
      type: object
      properties:
        translation:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Translation'
      additionalProperties: false
    TimeRange:
      type: object
      properties:
        start:
          type: integer
          format: int64
        end:
          type:
          - integer
          - 'null'
          format: int64
      additionalProperties: false
    TripDescriptor:
      type: object
      properties:
        trip_id:
          type:
          - string
          - 'null'
        route_id:
          type:
          - string
          - 'null'
        direction_id:
          type: integer
          format: int32
        direction_text:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    EntitySelector:
      type: object
      properties:
        agency_id:
          type:
          - string
          - 'null'
        route_id:
          type:
          - string
          - 'null'
        route_type:
          type: integer
          format: int32
        direction_id:
          type:
          - integer
          - 'null'
          format: int32
        direction_text:
          type:
          - string
          - 'null'
        trip:
          $ref: '#/components/schemas/TripDescriptor'
        stop_id:
          type:
          - string
          - 'null'
        route_label:
          type:
          - string
          - 'null'
          readOnly: true
      additionalProperties: false
    IAlert:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          readOnly: true
        last_modified_timestamp:
          type: integer
          format: int32
          readOnly: true
        alert_lifecycle:
          type:
          - string
          - 'null'
          readOnly: true
        active_period:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TimeRange'
          readOnly: true
        informed_entity:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EntitySelector'
          readOnly: true
        cause:
          type:
          - string
          - 'null'
          readOnly: true
        effect:
          type:
          - string
          - 'null'
          readOnly: true
        effect_detail:
          type:
          - string
          - 'null'
          readOnly: true
        url:
          $ref: '#/components/schemas/TranslatedString'
        header_text:
          $ref: '#/components/schemas/TranslatedString'
        description_text:
          $ref: '#/components/schemas/TranslatedString'
        severity_level:
          type:
          - string
          - 'null'
          readOnly: true
        image:
          $ref: '#/components/schemas/Image'
      additionalProperties: false
    Translation:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
        language:
          type:
          - string
          - 'null'
      additionalProperties: false
    LocalizedImage:
      type: object
      properties:
        url:
          type:
          - string
          - 'null'
        media_type:
          type:
          - string
          - 'null'
        language:
          type:
          - string
          - 'null'
      additionalProperties: false
