openapi: 3.2.0
info:
  title: Nex Trip API
  description: API for creating Metro Transit real-time departure information display (beta, subject to change)
  version: '2'
tags:
- name: NexTrip
paths:
  /nextrip/{route_id}/{direction_id}/{place_code}:
    get:
      tags:
      - NexTrip
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
      - name: direction_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: place_code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NexTripResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get nextrip by route id by direction id by place code
      x-summary-source: derived
      operationId: getNextripByRouteIdByDirectionIdByPlaceCode
      x-operation-id-source: derived
  /nextrip/{stop_id}:
    get:
      tags:
      - NexTrip
      parameters:
      - name: stop_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NexTripResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get nextrip by stop id
      x-summary-source: derived
      operationId: getNextripByStopId
      x-operation-id-source: derived
  /nextrip/agencies:
    get:
      tags:
      - NexTrip
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agency'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get nextrip agencies
      x-summary-source: derived
      operationId: getNextripAgencies
      x-operation-id-source: derived
  /nextrip/directions/{route_id}:
    get:
      tags:
      - NexTrip
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Direction'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get nextrip directions by route id
      x-summary-source: derived
      operationId: getNextripDirectionsByRouteId
      x-operation-id-source: derived
  /nextrip/routes:
    get:
      tags:
      - NexTrip
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get nextrip routes
      x-summary-source: derived
      operationId: getNextripRoutes
      x-operation-id-source: derived
  /nextrip/stopid/{street}:
    get:
      tags:
      - NexTrip
      parameters:
      - name: street
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get nextrip stopid by street
      x-summary-source: derived
      operationId: getNextripStopidByStreet
      x-operation-id-source: derived
  /nextrip/stops/{route_id}/{direction_id}:
    get:
      tags:
      - NexTrip
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
      - name: direction_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get nextrip stops by route id by direction id
      x-summary-source: derived
      operationId: getNextripStopsByRouteIdByDirectionId
      x-operation-id-source: derived
  /nextrip/vehicles/{route_id}:
    get:
      tags:
      - NexTrip
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get nextrip vehicles by route id
      x-summary-source: derived
      operationId: getNextripVehiclesByRouteId
      x-operation-id-source: derived
components:
  schemas:
    Direction:
      type: object
      properties:
        direction_id:
          type: integer
          format: int32
        direction_name:
          type:
          - string
          - 'null'
      additionalProperties: false
    Vehicle:
      type: object
      properties:
        trip_id:
          type:
          - string
          - 'null'
        direction_id:
          type: integer
          format: int32
        direction:
          type:
          - string
          - 'null'
        location_time:
          type: integer
          format: int64
        route_id:
          type:
          - string
          - 'null'
        terminal:
          type:
          - string
          - 'null'
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        bearing:
          type: number
          format: float
        odometer:
          type: number
          format: double
        speed:
          type: number
          format: float
      additionalProperties: false
    Place:
      type: object
      properties:
        place_code:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    Stop:
      type: object
      properties:
        stop_id:
          type: integer
          format: int32
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    AlertMessage:
      type: object
      properties:
        stop_closed:
          type: boolean
        alert_text:
          type:
          - string
          - 'null'
      additionalProperties: false
    NexTripResult:
      type: object
      properties:
        stops:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Stop'
        alerts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AlertMessage'
        departures:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Departure'
      additionalProperties: false
    Route:
      type: object
      properties:
        route_id:
          type:
          - string
          - 'null'
        agency_id:
          type: integer
          format: int32
        route_label:
          type:
          - string
          - 'null'
      additionalProperties: false
    Agency:
      type: object
      properties:
        agency_id:
          type: integer
          format: int32
        agency_name:
          type:
          - string
          - 'null'
      additionalProperties: false
    Departure:
      type: object
      properties:
        actual:
          type: boolean
        trip_id:
          type:
          - string
          - 'null'
        stop_id:
          type: integer
          format: int32
        departure_text:
          type:
          - string
          - 'null'
        departure_time:
          type: integer
          format: int64
        description:
          type:
          - string
          - 'null'
        gate:
          type:
          - string
          - 'null'
        route_id:
          type:
          - string
          - 'null'
        route_short_name:
          type:
          - string
          - 'null'
        direction_id:
          type: integer
          format: int32
        direction_text:
          type:
          - string
          - 'null'
        terminal:
          type:
          - string
          - 'null'
        agency_id:
          type: integer
          format: int32
        schedule_relationship:
          type:
          - string
          - 'null'
      additionalProperties: false
