openapi: 3.2.0
info:
  title: Trip Planner API
  description: API for retrieving Transit Trip Plans (beta, subject to change)
  version: '1'
tags:
- name: Planner
paths:
  /tripplanner/findaddress/{magicKey}/{geolocator}:
    get:
      tags:
      - Planner
      parameters:
      - name: magicKey
        in: path
        required: true
        schema:
          type: string
      - name: geolocator
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindAddressResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get tripplanner findaddress by magic key by geolocator
      x-summary-source: derived
      operationId: getTripplannerFindaddressByMagicKeyByGeolocator
      x-operation-id-source: derived
  /tripplanner/moreinfo:
    post:
      tags:
      - Planner
      parameters:
      - name: moreInfo
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Create tripplanner moreinfo
      x-summary-source: derived
      operationId: postTripplannerMoreinfo
      x-operation-id-source: derived
  /tripplanner/nearestlandmark:
    post:
      tags:
      - Planner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearestlandmarkInput'
          text/json:
            schema:
              $ref: '#/components/schemas/NearestlandmarkInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/NearestlandmarkInput'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Create tripplanner nearestlandmark
      x-summary-source: derived
      operationId: postTripplannerNearestlandmark
      x-operation-id-source: derived
  /tripplanner/nearestparkandrides:
    post:
      tags:
      - Planner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearestparkandrideInput'
          text/json:
            schema:
              $ref: '#/components/schemas/NearestparkandrideInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/NearestparkandrideInput'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Create tripplanner nearestparkandrides
      x-summary-source: derived
      operationId: postTripplannerNearestparkandrides
      x-operation-id-source: derived
  /tripplanner/plantrip:
    post:
      tags:
      - Planner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantripInput'
          text/json:
            schema:
              $ref: '#/components/schemas/PlantripInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PlantripInput'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Create tripplanner plantrip
      x-summary-source: derived
      operationId: postTripplannerPlantrip
      x-operation-id-source: derived
  /tripplanner/routelandmarks:
    post:
      tags:
      - Planner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutelandmarksInput'
          text/json:
            schema:
              $ref: '#/components/schemas/RoutelandmarksInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RoutelandmarksInput'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Create tripplanner routelandmarks
      x-summary-source: derived
      operationId: postTripplannerRoutelandmarks
      x-operation-id-source: derived
  /tripplanner/servicenearby:
    post:
      tags:
      - Planner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicenearbyInput'
          text/json:
            schema:
              $ref: '#/components/schemas/ServicenearbyInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ServicenearbyInput'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Create tripplanner servicenearby
      x-summary-source: derived
      operationId: postTripplannerServicenearby
      x-operation-id-source: derived
  /tripplanner/suggest/{text}/{location}:
    get:
      tags:
      - Planner
      parameters:
      - name: text
        in: path
        required: true
        schema:
          type: string
      - name: location
        in: path
        required: true
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suggestion'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
      summary: Get tripplanner suggest by text by location
      x-summary-source: derived
      operationId: getTripplannerSuggestByTextByLocation
      x-operation-id-source: derived
components:
  schemas:
    Point:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
      additionalProperties: false
    NearestparkandrideInput:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/PlannerLocation'
      additionalProperties: false
    FindAddressResponse:
      type: object
      properties:
        address:
          type:
          - string
          - 'null'
        atis_id:
          type:
          - string
          - 'null'
        x:
          type: number
          format: double
        y:
          type: number
          format: double
      additionalProperties: false
    PlantripInput:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/PlannerLocation'
        destination:
          $ref: '#/components/schemas/PlannerLocation'
        arrdep:
          type:
          - string
          - 'null'
        walkdist:
          type: number
          format: double
        minimize:
          type:
          - string
          - 'null'
        accessible:
          type: boolean
        xmode:
          type:
          - string
          - 'null'
        datetime:
          type: string
          format: date-time
      additionalProperties: false
    ServicenearbyInput:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/PlannerLocation'
        walkdist:
          type: number
          format: double
        accessible:
          type: boolean
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Suggestion:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
        magic_key:
          type:
          - string
          - 'null'
        geolocator:
          type: integer
          format: int32
      additionalProperties: false
    PlannerLocation:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        point:
          $ref: '#/components/schemas/Point'
        landmarkid:
          type: integer
          format: int32
      additionalProperties: false
    RoutelandmarksInput:
      type: object
      properties:
        route:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        noduplicates:
          type: boolean
      additionalProperties: false
    NearestlandmarkInput:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/PlannerLocation'
        maxanswers:
          type: integer
          format: int32
        category:
          type:
          - string
          - 'null'
      additionalProperties: false
