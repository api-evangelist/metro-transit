aid: metro-transit
name: Metro Transit
description: >-
  Metro Transit provides real-time departure information, service alerts, trip planning, and schedule data APIs for the
  Minneapolis-Saint Paul metropolitan transit system. The APIs support creating transit departure displays and accessing
  real-time bus and train arrival data for the Twin Cities.
